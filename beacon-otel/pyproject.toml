  "opentelemetry-instrumentation-mysql == 0.66b2",
  "opentelemetry-instrumentation-mysqlclient == 0.66b2",
  "opentelemetry-instrumentation-pika == 0.66b2",
  "opentelemetry-instrumentation-psycopg == 0.66b2",
