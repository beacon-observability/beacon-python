[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-otel"
dynamic = ["version"]
description = "Beacon Python auto-instrumentation distribution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Beacon Observability" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-api == 1.45.2",
  "opentelemetry-sdk == 1.45.2",
  "opentelemetry-instrumentation == 0.66b2",
  "opentelemetry-instrumentation-threading == 0.66b2",
  "opentelemetry-exporter-otlp == 1.45.2",
  "packaging >= 24",
  "wrapt >= 1.17, < 3",
]

[project.optional-dependencies]
# Generated from beacon/instrumentation-extras.json and the version locks.
# Update with: python beacon/scripts/check-version.py --sync
profiling = ["beacon-profiling == 1.2.6"]
aio-pika = ["opentelemetry-instrumentation-aio-pika == 0.66b2"]
aiohttp-client = ["opentelemetry-instrumentation-aiohttp-client == 0.66b2"]
aiohttp-server = ["opentelemetry-instrumentation-aiohttp-server == 0.66b2"]
aiokafka = ["opentelemetry-instrumentation-aiokafka == 0.66b2"]
aiopg = ["opentelemetry-instrumentation-aiopg == 0.66b2"]
asgi = ["opentelemetry-instrumentation-asgi == 0.66b2"]
asyncclick = ["opentelemetry-instrumentation-asyncclick == 0.66b2"]
asyncio = ["opentelemetry-instrumentation-asyncio == 0.66b2"]
asyncpg = ["opentelemetry-instrumentation-asyncpg == 0.66b2"]
aws-lambda = ["opentelemetry-instrumentation-aws-lambda == 0.66b2"]
boto3sqs = ["opentelemetry-instrumentation-boto3sqs == 0.66b2"]
botocore = ["opentelemetry-instrumentation-botocore == 0.66b2"]
cassandra = ["opentelemetry-instrumentation-cassandra == 0.66b2"]
celery = ["opentelemetry-instrumentation-celery == 0.66b2"]
click = ["opentelemetry-instrumentation-click == 0.66b2"]
confluent-kafka = ["opentelemetry-instrumentation-confluent-kafka == 0.66b2"]
dbapi = ["opentelemetry-instrumentation-dbapi == 0.66b2"]
