jinja2 = ["opentelemetry-instrumentation-jinja2 == 0.66b2"]
kafka-python = ["opentelemetry-instrumentation-kafka-python == 0.66b2"]
logging = ["opentelemetry-instrumentation-logging == 0.66b2"]
