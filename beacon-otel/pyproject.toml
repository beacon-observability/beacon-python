[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-otel"
dynamic = ["version"]
description = "Beacon Python auto-instrumentation distribution"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Beacon Observability" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-api == 1.44.0",
  "opentelemetry-sdk == 1.44.0",
  "opentelemetry-instrumentation == 0.65b0",
  "opentelemetry-exporter-otlp == 1.44.0",
]

[project.optional-dependencies]
profiling = ["beacon-profiling == 1.0.1"]
requests = ["opentelemetry-instrumentation-requests == 0.65b0"]
flask = ["opentelemetry-instrumentation-flask == 0.65b0"]
fastapi = ["opentelemetry-instrumentation-fastapi == 0.65b0"]

[project.scripts]
beacon = "beacon_otel.cli:main"

[project.entry-points.opentelemetry_distro]
beacon = "beacon_otel.distro:BeaconDistro"

[project.entry-points.opentelemetry_configurator]
beacon = "beacon_otel.distro:BeaconConfigurator"

[project.urls]
Homepage = "https://github.com/beacon-observability/beacon-python/tree/main/beacon-otel"
Repository = "https://github.com/beacon-observability/beacon-python"

[tool.hatch.version]
path = "src/beacon_otel/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_otel"]
