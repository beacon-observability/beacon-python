  "opentelemetry-instrumentation-wsgi == 0.66b2",
]

[project.scripts]
beacon = "beacon_otel.cli:main"

[project.entry-points.opentelemetry_distro]
beacon = "beacon_otel.distro:BeaconDistro"

[project.entry-points.opentelemetry_configurator]
beacon = "beacon_otel.distro:BeaconConfigurator"

[project.entry-points.opentelemetry_instrumentor]
beacon_security = "beacon_security:SecurityInstrumentor"

[project.entry-points.opentelemetry_pre_instrument]
beacon_security = "beacon_security:bootstrap"

[project.urls]
Homepage = "https://github.com/beacon-observability/beacon-python/tree/main/beacon-otel"
Repository = "https://github.com/beacon-observability/beacon-python"

[tool.hatch.version]
path = "src/beacon_otel/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_otel", "src/beacon_security"]
