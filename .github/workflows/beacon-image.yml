name: Beacon Python image

on:
  pull_request:
    paths:
      - .github/workflows/beacon-image.yml
      - beacon/docker/python/**
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable Beacon Python release version (X.Y.Z, without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beacon-python-image-${{ github.event.pull_request.number || inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'beacon-observability/beacon-python'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          # A fixed public release exercises packaging changes before they reach main.
          VERSION: ${{ inputs.version || '1.2.4' }}
        run: python3 beacon/docker/python/prepare.py "$VERSION" release-image
      - name: Install image archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Build and test the native candidate once
        env:
          VERSION: ${{ inputs.version || '1.2.4' }}
          ARCH: ${{ matrix.arch }}
        run: |
          source=$(jq -r .source_commit release-image/provenance.json)
          docker build --pull --platform "linux/$ARCH" \
            -f beacon/docker/python/Dockerfile \
            --build-arg "BEACON_VERSION=$VERSION" \
            --build-arg "BEACON_SOURCE_REVISION=$source" \
            -t beacon-python-candidate release-image
          # Materialize compressed registry layers before testing and promotion.
          skopeo copy --format v2s2 --dest-compress \
            docker-daemon:beacon-python-candidate:latest "dir:beacon-python-$ARCH"
          skopeo copy "dir:beacon-python-$ARCH" docker-daemon:beacon-python-verified:latest
          bash beacon/docker/python/verify-image.sh beacon-python-verified "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-python-image-${{ matrix.arch }}
          path: beacon-python-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beacon-release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beacon-python-image-*
          path: image-candidates
      - name: Install image promotion tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified archives without rebuilding or architecture tags
        env:
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/beacon-observability/beacon-python
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # GHCR denies anonymous registry reads before a package's first publication.
          # Use the authenticated package API; accept only an explicit 404 as absence.
          if gh api --paginate --slurp \
            'orgs/beacon-observability/packages/container/beacon-python/versions?per_page=100' \
            > existing-versions.json 2> existing-image.err; then
            if jq -e --arg version "$VERSION" \
              '[.[][] | .metadata.container.tags[]] | index($version) != null' existing-versions.json; then
              echo "Refusing to overwrite $IMAGE:$VERSION" >&2
              exit 1
            fi
          elif ! grep -Fq '(HTTP 404)' existing-image.err; then
            cat existing-image.err >&2
            exit 1
          fi
          references=()
          for arch in amd64 arm64; do
            archive="image-candidates/beacon-python-image-$arch"
            skopeo inspect "dir:$archive" > candidate.json
            [[ "$(jq -r .Architecture candidate.json)" == "$arch" ]]
            [[ "$(jq -r '.Labels["org.opencontainers.image.version"]' candidate.json)" == "$VERSION" ]]
            digest=$(jq -r .Digest candidate.json)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            skopeo copy --preserve-digests "dir:$archive" "docker://$IMAGE@$digest"
            references+=("$IMAGE@$digest")
          done
          docker manifest create "$IMAGE:$VERSION" "${references[@]}"
          docker manifest push "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee image-manifest.txt
          {
            echo '### Beacon Python image'
            echo "\`$IMAGE:$VERSION\`"
            echo '```text'
            cat image-manifest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
