name: Beacon Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beacon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check version and baseline
        run: python beacon/scripts/check-version.py
      - name: Lint Beacon-owned code
        run: |
          uvx --from ruff==0.14.1 ruff check \
            beacon-otel \
            sdk-extension/beacon-profiling \
            beacon/examples/fastapi-demo \
            beacon/scripts \
            beacon/tests
          uvx --from ruff==0.14.1 ruff format --check \
            beacon-otel \
            sdk-extension/beacon-profiling \
            beacon/examples/fastapi-demo \
            beacon/scripts \
            beacon/tests
      - name: Build both Beacon packages
        run: |
          uv build --package beacon-otel --out-dir dist
          uv build --package beacon-profiling --out-dir dist
      - name: Check distribution metadata
        run: |
          uvx twine check dist/*
          python beacon/scripts/check-version.py --wheel dist/beacon_otel-*.whl --wheel dist/beacon_profiling-*.whl
      - name: Test installed wheels
        run: |
          uv venv .beacon-test-env
          uv pip install --python .beacon-test-env/bin/python --find-links dist 'beacon-otel[profiling,requests]' pytest jsonschema
          uv pip install --python .beacon-test-env/bin/python --reinstall --no-deps --no-cache \
            dist/beacon_otel-*.whl dist/beacon_profiling-*.whl
          .beacon-test-env/bin/python -m pytest -q beacon/tests beacon-otel/tests --ignore=beacon-otel/tests/security
          .beacon-test-env/bin/python -m pytest -q beacon-otel/tests/security/test_schema_contract.py
          .beacon-test-env/bin/python -m pytest -q sdk-extension/beacon-profiling/tests
          .beacon-test-env/bin/beacon --version
      - name: Install Beacon Security test dependencies
        if: matrix.python-version != '3.10'
        run: |
          uv pip install --python .beacon-test-env/bin/python --find-links dist \
            'opentelemetry-instrumentation-flask==0.65b0' \
            'opentelemetry-instrumentation-fastapi==0.65b0' \
            'opentelemetry-instrumentation-django==0.65b0' \
            'cyclonedx-python-lib==11.12.0' \
            'pydantic>=2,<3' 'flask>=3.1,<3.2' 'django>=5.2,<5.3' \
            'fastapi>=0.141,<0.142' 'starlette>=1.6,<1.7' \
            'uvicorn>=0.52,<0.53' gunicorn httpx requests aiohttp \
            'sqlalchemy>=2,<3' 'psycopg[binary]>=3,<4' 'pymysql>=1,<2' \
            python-multipart psutil
      - name: Test Beacon Security runtime
        if: matrix.python-version != '3.10'
        run: .beacon-test-env/bin/python -m pytest -q beacon-otel/tests/security
