[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-profiling"
dynamic = ["version"]
description = "Beacon Profiling for OpenTelemetry Python"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "GuanceCloud" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "opentelemetry-api == 1.44.0",
  "opentelemetry-sdk == 1.44.0",
  "opentelemetry-instrumentation == 0.65b0",
  "opentelemetry-exporter-otlp == 1.44.0",
  "requests >= 2.20",
]

[project.entry-points.opentelemetry_pre_instrument]
profiling = "opentelemetry.sdk.extension.profiling.bootstrap:auto_start"

[project.entry-points.opentelemetry_environment_variables]
profiling = "opentelemetry.sdk.extension.profiling.environment_variables"

[project.urls]
Homepage = "https://github.com/beacon-observability/beacon-python/tree/main/sdk-extension/beacon-profiling"
Repository = "https://github.com/beacon-observability/beacon-python"

[tool.hatch.version]
path = "src/opentelemetry/sdk/extension/profiling/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.rst",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
